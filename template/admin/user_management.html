<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin - Users</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }
    h1 {
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    button {
      padding: 6px 10px;
      margin: 2px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .block-btn {
      background-color: #ff4d4d;
      color: white;
    }
    .unblock-btn {
      background-color: #4CAF50;
      color: white;
    }

    
      
    
  </style>
</head>
<body>

 
  <h1>User Management</h1>
  <table id="userTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Blocked</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="userTableBody">
      <!-- User rows will be populated here -->
    </tbody>
  </table>

  <script>
    const token = localStorage.getItem("access_token");

    async function fetchUsers() {
      const res = await fetch("http://localhost:8080/admin/users", {
        headers: {
          "Authorization": "Bearer " + token
        }
      });
      const users = await res.json();
      populateTable(users);
    }

    function populateTable(users) {
      const tbody = document.getElementById("userTableBody");
      tbody.innerHTML = "";
console.log(users);

      users.forEach(user => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td>${user.ID}</td>
          <td>${user.name}</td>
          <td>${user.email}</td>
          <td>${user.Blocked ? "Yes" : "No"}</td>
          <td>
            ${user.Blocked
              ? `<button class="unblock-btn" onclick="unblockUser(${user.ID})">Unblock</button>`
              : `<button class="block-btn" onclick="blockUser(${user.ID})">Block</button>`}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function blockUser(userId) {
      const res = await fetch(`http://localhost:8080/admin/users/block/${userId}`, {
        method: "PUT",
        headers: {
          "Authorization": "Bearer " + token
        }
      });
      if (res.ok) {
        alert("User blocked successfully");
        fetchUsers();
      } else {
        alert("Failed to block user");
      }
    }

    async function unblockUser(userId) {
      const res = await fetch(`http://localhost:8080/admin/users/unblock/${userId}`, {
        method: "PUT",
        headers: {
          "Authorization": "Bearer " + token
        }
      });
      if (res.ok) {
        alert("User unblocked successfully");
        fetchUsers();
      } else {
        alert("Failed to unblock user");
      }
    }

    // Initial load
    fetchUsers();
  </script>
</body>
</html>
