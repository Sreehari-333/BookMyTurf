<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>All Bookings - Admin Dashboard</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
      }

      h2 {
        color: #2c3e50;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 15px;
      }

      th,
      td {
        text-align: left;
        padding: 10px;
        border-bottom: 1px solid #ccc;
      }

      th {
        background-color: #f8f8f8;
      }

      tr:hover {
        background-color: #f1f1f1;
      }

      .status-booked {
        color: green;
        font-weight: bold;
      }

    </style>
  </head>
  <body>
    
    <h2>All Turf Bookings</h2>

    <table id="bookings-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>User Name</th>
          <th>Turf Name</th>
          <th>Date</th>
          <th>Start Time</th>
          <th>End Time</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <!-- Bookings will be populated here -->
      </tbody>
    </table>

    <script>
      // Fetch bookings from API
      fetch("http://localhost:8080/admin/allbookings", {
        headers: {
          Authorization: "Bearer " + localStorage.getItem("access_token"),
        },
      })
        .then((response) => response.json())
        .then((bookings) => {
          const tbody = document.querySelector("#bookings-table tbody");
          console.log(bookings);
          
          bookings.forEach((booking) => {
            const row = document.createElement("tr");

            row.innerHTML = `
                    <td>${booking.ID}</td>
                    <td>${booking.user.name}</td>
                    <td>${booking.turf.name}</td>
                    <td>${booking.date}</td>
                    <td>${new Date(
                      booking.start_time
                    ).toLocaleTimeString()}</td>
                    <td>${new Date(booking.end_time).toLocaleTimeString()}</td>
                    <td class="status-booked">${booking.status}</td>
                `;

            tbody.appendChild(row);
          });
        })
        .catch((error) => {
          console.error("Error fetching bookings:", error);
        });
    </script>
  </body>
</html>
